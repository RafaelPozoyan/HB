<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на свидание с Рафулей</title>
  <link rel="icon" href="../assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/font.css">
  <link rel="stylesheet" href="../css/gate.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/player.css">
  <style>
    /* Форма ответа на приглашение */
    .response-form {
      margin-top: 26px;
      text-align: left;
    }

    .response-form__label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .response-form__field {
      margin-top: 16px;
    }

    .response-form__field:first-of-type {
      margin-top: 0;
    }

    /* Однострочное поле (вопросы про время/место/еду) */
    .response-form__input {
      min-height: 0;
      padding-top: 10px;
      padding-bottom: 10px;
      resize: none;
    }

    .response-form__textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(163, 235, 177, .25);
      border-radius: 14px;
      background: rgba(26, 22, 43, .55);
      padding: 10px 15px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
      min-height: 46px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, opacity .2s ease, background .2s ease;
    }

    .response-form__textarea::placeholder {
      color: var(--muted-dim);
    }

    .response-form__textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(163, 235, 177, .12);
    }

    .response-form__textarea[readonly] {
      opacity: .75;
      cursor: default;
      background: rgba(163, 235, 177, .08);
    }

    /* Быстрые варианты ответа под полями */
    .quick-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .quick-pick {
      padding: 6px 12px;
      border: 1px solid rgba(163, 235, 177, .25);
      border-radius: 999px;
      background: rgba(255, 255, 255, .02);
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }

    .quick-pick:hover {
      border-color: rgba(163, 235, 177, .5);
      background: rgba(163, 235, 177, .10);
      color: var(--accent);
    }

    .quick-pick.is-active {
      border-color: rgba(163, 235, 177, .65);
      background: rgba(163, 235, 177, .18);
      color: #d6f8dd;
    }

    .response-form__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .response-form__actions .btn {
      margin-top: 0;
    }

    /* Резервные кнопки: класс .btn задаёт display, поэтому hidden нужно усилить */
    .response-form__actions .btn[hidden] {
      display: none;
    }

    .response-form__status {
      margin-top: 16px;
      min-height: 22px;
      font-size: 14px;
    }

    .response-form__status.is-error {
      color: #f2a7b0;
    }

    .response-form__status.is-ok {
      color: var(--accent);
    }

    /* Сообщение об успешной отправке */
    #response.is-ok {
      margin-top: 22px;
      color: #d6f8dd;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<!-- Плеер и бар: место под плеер задано сразу в разметке, чтобы бар не сдвигался при загрузке -->
<div class="top-dock is-sticky">
  <div class="nav-player" aria-hidden="true"></div>

  <nav class="site-nav">
    <a class="site-nav__brand" href="../index.html"><span>♡</span><span>Для Алины</span></a>
    <div class="site-nav-links">
      <a href="mini-games.html">Мини-игры</a>
      <a href="travels.html">Путешествия Алины</a>
      <a href="loved-ones.html">Поздравления</a>
      <a href="date.html" class="active">Запись на свиданку</a>
    </div>
  </nav>
</div>

<main class="page">
  <header class="page-heading">
    <h1>Запись на свидание<br>с Рафулей</h1>
  </header>

  <div class="text-panel">
    <div id="intro">
      <h2>Алина, приглашаю тебя на свидание 💜</h2>
      <p>Заполни форму и все будет исполнено!</p>

      <!-- Кнопка открывает форму ответа -->
      <button type="button" id="accept" class="btn btn--primary">
        Принять приглашение
      </button>
    </div>

    <!-- Форма ответа: показывается после нажатия «Принять приглашение» -->
    <form
      id="response-form"
      class="response-form"
      action="https://formsubmit.co/2fa32a0ce8b7e889ff90c78fa28c2ccb"
      method="POST"
      hidden
    >
      <!-- Служебные поля FormSubmit -->
      <input type="hidden" name="_subject" value="Ответ на приглашение на свидание 💜">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="response-form__field" data-field>
        <label for="q-when" class="response-form__label">Когда вы хотите пойти?</label>
        <input
          type="text"
          id="q-when"
          name="Когда пойти"
          class="response-form__textarea response-form__input"
          placeholder="Введите ответ или выберите один из предложенных ответов"
          required
        >
        <div class="quick-picks">
          <button type="button" class="quick-pick" data-pick="Когда рафуля захочет" aria-pressed="false">Когда рафуля захочет</button>
          <button type="button" class="quick-pick" data-pick="Я не знаю ☹️" aria-pressed="false">Я не знаю ☹️</button>
        </div>
      </div>

      <div class="response-form__field" data-field>
        <label for="q-where" class="response-form__label">Куда вы хотите пойти?</label>
        <input
          type="text"
          id="q-where"
          name="Куда пойти"
          class="response-form__textarea response-form__input"
          placeholder="Введите ответ или выберите один из предложенных ответов"
          required
        >
        <div class="quick-picks">
          <button type="button" class="quick-pick" data-pick="В центр" aria-pressed="false">В центр</button>
          <button type="button" class="quick-pick" data-pick="В лес" aria-pressed="false">В лес</button>
          <button type="button" class="quick-pick" data-pick="Кататься на машинке" aria-pressed="false">Кататься на машинке</button>
          <button type="button" class="quick-pick" data-pick="В киношку" aria-pressed="false">В киношку</button>
          <button type="button" class="quick-pick" data-pick="Я не знаю ☹️" aria-pressed="false">Я не знаю ☹️</button>
        </div>
      </div>

      <div class="response-form__field" data-field>
        <label for="q-food" class="response-form__label">Что вы будете кушать?</label>
        <input
          type="text"
          id="q-food"
          name="Что кушать"
          class="response-form__textarea response-form__input"
          placeholder="Введите ответ или выберите один из предложенных ответов"
          required
        >
        <div class="quick-picks">
          <button type="button" class="quick-pick" data-pick="Я не умею!!!" aria-pressed="false">Я не умею!!!</button>
          <button type="button" class="quick-pick" data-pick="Роллы" aria-pressed="false">Роллы</button>
          <button type="button" class="quick-pick" data-pick="Супчик" aria-pressed="false">Супчик</button>
          <button type="button" class="quick-pick" data-pick="Бургер" aria-pressed="false">Бургер</button>
          <button type="button" class="quick-pick" data-pick="Пиццу 🤮" aria-pressed="false">Пиццу 🤮</button>
          <button type="button" class="quick-pick" data-pick="Я не знаю ☹️" aria-pressed="false">Я не знаю ☹️</button>
        </div>
      </div>

      <div class="response-form__field" data-field>
        <label for="q-wishes" class="response-form__label">Особые пожелания</label>
        <textarea
          id="q-wishes"
          name="Особые пожелания"
          class="response-form__textarea"
          placeholder="Всё, что важно учесть..."
          rows="3"
          required
        ></textarea>
        <div class="quick-picks">
          <button type="button" class="quick-pick" data-pick="Я не знаю ☹️" aria-pressed="false">Я не знаю ☹️</button>
        </div>
      </div>

      <div class="response-form__actions">
        <button type="submit" id="send-answer" class="btn btn--primary">
          Отправить
        </button>
        <!-- Показываются, только если почтовый сервис недоступен -->
        <a id="send-mail" class="btn btn--ghost" href="#" hidden>Отправить письмом</a>
        <button type="button" id="copy-answer" class="btn btn--ghost" hidden>
          Скопировать ответ
        </button>
      </div>

      <p id="response-status" class="response-form__status" role="status" aria-live="polite"></p>
    </form>

    <p id="response" aria-live="polite"></p>
  </div>

  <a class="back-link" href="../index.html">← На главную</a>
</main>

<script>
  (function () {
    var acceptBtn = document.getElementById('accept');
    var form = document.getElementById('response-form');
    var status = document.getElementById('response-status');
    var submitBtn = document.getElementById('send-answer');
    var mailLink = document.getElementById('send-mail');
    var copyBtn = document.getElementById('copy-answer');

    // Куда приходит ответ и сколько ждём ответа от почтового сервиса
    var RECIPIENT_EMAIL = 'pozoyan.2000@gmail.com';
    // Основной канал — Web3Forms (ключ привязан к почте владельца)
    var WEB3FORMS_KEY = '9f08dfd6-f898-478f-9b52-89169c398dea';
    // Резервный канал — FormSubmit
    var FORM_SUBMIT_URL = 'https://formsubmit.co/ajax/2fa32a0ce8b7e889ff90c78fa28c2ccb';
    var SEND_TIMEOUT_MS = 12000;

    // Все поля формы
    var fields = [
      document.getElementById('q-when'),
      document.getElementById('q-where'),
      document.getElementById('q-food'),
      document.getElementById('q-wishes')
    ];

    // Запоминаем исходные плейсхолдеры
    fields.forEach(function (el) {
      el.dataset.originalPlaceholder = el.placeholder;
    });

    // Поле заполнено кнопкой быстрого выбора
    function isPicked(el) {
      return el.readOnly && el.value.trim() !== '';
    }

    // Показать форму после «Принять приглашение»
    acceptBtn.addEventListener('click', function () {
      form.hidden = false;
      document.getElementById('intro').hidden = true;
      document.getElementById('response').textContent = '';
      fields[0].focus();
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    function clearStatus() {
      status.textContent = '';
      status.classList.remove('is-error', 'is-ok');
    }

    // Кнопки быстрых ответов под полями — заполняют только своё поле
    form.querySelectorAll('.quick-picks').forEach(function (group) {
      var field = group.closest('[data-field]');
      var input = field ? field.querySelector('input, textarea') : null;
      var picks = group.querySelectorAll('.quick-pick');

      if (!input) return;

      picks.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var wasActive = btn.classList.contains('is-active');

          // снимаем выделение со всех кнопок этой группы
          picks.forEach(function (other) {
            other.classList.remove('is-active');
            other.setAttribute('aria-pressed', 'false');
          });

          if (wasActive) {
            // повторный клик — очищаем поле
            input.value = '';
            input.readOnly = false;
            input.setAttribute('required', '');
            input.placeholder = input.dataset.originalPlaceholder || '';
          } else {
            btn.classList.add('is-active');
            btn.setAttribute('aria-pressed', 'true');
            input.value = btn.dataset.pick;
            input.readOnly = true;
            input.removeAttribute('required');
            input.placeholder = '';
          }
          clearStatus();
        });
      });
    });

    // Очищаем ошибку, когда пользователь снова начинает печатать
    fields.forEach(function (el) {
      el.addEventListener('input', function () {
        if (status.classList.contains('is-error')) {
          clearStatus();
        }
      });
    });

    // POST JSON с таймаутом: без него кнопка навсегда остаётся в «Отправляем...»
    function postJson(url, body) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, SEND_TIMEOUT_MS);

      function done() { clearTimeout(timer); }

      return fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(body),
        signal: controller.signal
      }).then(function (response) {
        done();
        return response.json().then(function (data) {
          return { response: response, data: data };
        }, function () {
          // сервис ответил не JSON (например, страницу ошибки Cloudflare)
          return { response: response, data: {} };
        });
      }, function (error) {
        done();
        throw error;
      });
    }

    function isFailure(res) {
      return !res.response.ok ||
        res.data.success === false ||
        res.data.success === 'false';
    }

    function sendViaFormSubmit(payload) {
      return postJson(FORM_SUBMIT_URL, payload).then(function (res) {
        if (isFailure(res)) {
          throw new Error(res.data.message || 'FormSubmit недоступен');
        }
      });
    }

    function sendViaWeb3Forms(subject, text) {
      if (!WEB3FORMS_KEY) {
        return Promise.reject(new Error('Web3Forms не настроен'));
      }
      return postJson('https://api.web3forms.com/submit', {
        access_key: WEB3FORMS_KEY,
        subject: subject,
        from_name: 'Сайт для Алины',
        message: text
      }).then(function (res) {
        if (isFailure(res)) {
          throw new Error(res.data.message || 'Web3Forms недоступен');
        }
      });
    }

    function prepareMailFallback(text) {
      var subject = 'Ответ на приглашение на свидание 💜';
      mailLink.href = 'mailto:' + RECIPIENT_EMAIL +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(text);
      copyBtn.dataset.text = text;
    }

    function hideFallback() {
      mailLink.hidden = true;
      copyBtn.hidden = true;
      copyBtn.textContent = 'Скопировать ответ';
    }

    function showFallback() {
      mailLink.hidden = false;
      copyBtn.hidden = false;
    }

    copyBtn.addEventListener('click', function () {
      var text = copyBtn.dataset.text || '';

      function manualCopy() {
        var area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); } catch (err) { /* ignore */ }
        document.body.removeChild(area);
        copyBtn.textContent = 'Скопировано ✓';
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          copyBtn.textContent = 'Скопировано ✓';
        }, manualCopy);
      } else {
        manualCopy();
      }
    });

    // Валидация перед отправкой
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearStatus();

      for (var i = 0; i < fields.length; i++) {
        var el = fields[i];
        // поле обязательно, если не выбрано «Я не знаю» и оно пустое
        if (!isPicked(el) && !el.value.trim()) {
          el.focus();
          status.textContent = 'Пожалуйста, ответь на все вопросы или выбери один из предложенных под нужным полем.';
          status.classList.add('is-error');
          return;
        }
      }

      // Собираем данные формы в объект
      var subject = 'Ответ на приглашение на свидание 💜';
      var payload = {
        _subject: subject,
        _template: 'table',
        _captcha: 'false'
      };
      var answerText = fields.map(function (el) {
        payload[el.name] = el.value.trim();
        return el.name + ': ' + el.value.trim();
      }).join('\n');

      // Готовим резервный вариант заранее — чтобы ответ не потерялся
      prepareMailFallback(answerText);
      hideFallback();

      // Блокируем кнопку, чтобы не отправить дважды
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправляем...';

      function showSuccess() {
        form.hidden = true;
        hideFallback();
        var responseEl = document.getElementById('response');
        responseEl.textContent = 'Ваши предпочтения направлены Рафуле, ждите ответа!';
        responseEl.classList.add('is-ok');
        responseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      try {
        await sendViaWeb3Forms(subject, answerText);
        showSuccess();
      } catch (web3formsError) {
        console.warn('Web3Forms не сработал:', web3formsError);

        try {
          await sendViaFormSubmit(payload);
          showSuccess();
        } catch (formSubmitError) {
          console.error('Ошибка отправки:', formSubmitError);
          status.textContent = 'Почтовый сервис сейчас недоступен. Отправь ответ письмом — адрес и текст уже подставлены — или скопируй ответ и пришли его Рафуле в Telegram.';
          status.classList.add('is-error');
          showFallback();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Попробовать снова';
        }
      }
    });
  })();
</script>

<script src="../js/gate.js"></script>
<script src="../js/access.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/player.js"></script>
</body>
</html>
